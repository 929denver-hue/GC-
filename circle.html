    <div class="mx-auto grid max-w-7xl gap-12 px-5 lg:grid-cols-2">
     <div>
      <p data-template-id="consult-kicker" class="canva-text section-kicker text-[#c9ef63]"></p>
      <h2 data-template-id="consult-title" class="canva-text display mt-4 font-extrabold text-white"></h2>
      <p data-template-id="consult-description" class="canva-text mt-6 max-w-xl leading-8 text-white/80"></p>
     </div>
     <form id="consult-form" class="rounded-[2rem] bg-white p-7 shadow-xl" novalidate><label data-template-id="name-label" class="canva-text mb-2 block text-sm font-bold" for="name"></label> <input id="name" class="focus-ring w-full rounded-xl border border-[#103b36]/20 px-4 py-3" type="text" required> <label data-template-id="email-label" class="canva-text mb-2 mt-5 block text-sm font-bold" for="email"></label> <input id="email" class="focus-ring w-full rounded-xl border border-[#103b36]/20 px-4 py-3" type="email" required> <label data-template-id="message-label" class="canva-text mb-2 mt-5 block text-sm font-bold" for="message"></label> <textarea id="message" class="focus-ring w-full rounded-xl border border-[#103b36]/20 px-4 py-3" rows="4"></textarea>
      <p id="form-status" class="mt-4 min-h-6 text-sm font-semibold" aria-live="polite"></p><button id="submit-button" data-template-id="submit-button" type="submit" class="canva-button focus-ring mt-3 w-full rounded-full px-6 py-4 font-bold transition hover:brightness-95"></button>
     </form>
    </div>
   </section>
  </main>
  <footer id="app" data-template-id="footer-section" class="canva-footer bg-[#103b36] px-5 py-12 text-white">
   <div class="mx-auto flex max-w-7xl flex-col justify-between gap-8 md:flex-row md:items-end">
    <div>
     <p data-template-id="footer-brand" class="canva-text display text-2xl font-extrabold"></p>
     <p data-template-id="footer-text" class="canva-text mt-3 max-w-md text-sm leading-7 text-white/65"></p>
    </div>
    <div>
     <p data-template-id="footer-app-title" class="canva-text font-bold text-[#c9ef63]"></p>
     <p data-template-id="footer-app-text" class="canva-text mt-2 text-sm text-white/70"></p>
    </div>
   </div>
  </footer>
  <script src="/_sdk/fef09cb5f5b2424b.editing_sdk.js" integrity="sha512-PbmCvZWt+xecnQll4ofK5HTtTS+pGwwY1xn9+p49qHgEHml+uvyc0o1f2Eltkd4t324iwgnf7acUjfnKHkik1w=="></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const menuButton = document.getElementById('menu-button');
      const mobileNav = document.getElementById('mobile-nav');
      menuButton.addEventListener('click', () => {
        const open = mobileNav.classList.toggle('hidden') === false;
        menuButton.setAttribute('aria-expanded', String(open));
      });
      mobileNav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
        mobileNav.classList.add('hidden'); menuButton.setAttribute('aria-expanded', 'false');
      }));
      const observer = new IntersectionObserver(entries => entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      }), { threshold:.12 });
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    });

    let totalRows = 0;
    const status = document.getElementById('form-status');
    const submitButton = document.getElementById('submit-button');
    const handler = { onDataChanged(data) { totalRows = data.length; } };

    async function startData() {
      const result = await window.dataSdk.init(handler);
      if (!result.isOk) {
        status.textContent = '目前無法連線，請稍後再試。';
        status.className = 'mt-4 min-h-6 text-sm font-semibold text-[#b42318]';
      }
    }
    startData();

    document.getElementById('consult-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      if (!name || !email || !/^\S+@\S+\.\S+$/.test(email)) {
        status.textContent = '請填寫姓名與有效的 Email。';
        status.className = 'mt-4 min-h-6 text-sm font-semibold text-[#b42318]';
        return;
      }
      if (totalRows >= 999) {
        status.textContent = '目前諮詢資料已達上限，請稍後再試。';
        status.className = 'mt-4 min-h-6 text-sm font-semibold text-[#b42318]';
        return;
      }
      submitButton.disabled = true;
      submitButton.style.opacity = '.65';
      status.textContent = '正在送出您的諮詢…';
      status.className = 'mt-4 min-h-6 text-sm font-semibold text-[#246b57]';
      const result = await window.dataSdk.create({ name, email, message, submitted_at: new Date().toISOString() });
      submitButton.disabled = false;
      submitButton.style.opacity = '1';
      if (result.isOk) {
        event.target.reset();
        status.textContent = '已收到您的需求，GC圈團隊將盡快與您聯繫。';
        status.className = 'mt-4 min-h-6 text-sm font-semibold text-[#246b57]';
      } else {
        status.textContent = '送出未成功，請稍後再試。';
        status.className = 'mt-4 min-h-6 text-sm font-semibold text-[#b42318]';
      }
    });
  </script>
 </body>
</html>
