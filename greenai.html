<script>

/* ===================================================
   Chart.js 數字標籤
=================================================== */

Chart.register(ChartDataLabels);


/* 預設所有圖表直接顯示數字 */

Chart.defaults.plugins.datalabels = {

  display: function(context) {

    const value =
      context.dataset.data[
        context.dataIndex
      ];

    return Number(value) !== 0;

  },

  color: '#334155',

  font: {
    size: 10,
    weight: '600'
  },

  anchor: 'end',

  align: 'top',

  offset: 3,

  clamp: true,

  formatter: function(value) {

    return Number(value)
      .toLocaleString(
        'zh-TW',
        {
          maximumFractionDigits: 1
        }
      );

  }

};


/* ===================================================
   CONFIG
=================================================== */

const CONFIG = {

  API_URL:
    'https://script.google.com/macros/s/AKfycbxBnu4zBqt1JM7VmNHwhYIBcwmHDKCiopyJcH6OraM_ou1NCC-YjolwNZptucSU9b4E/exec'

};


/* ===================================================
   State
=================================================== */

const state = {

  data: null,

  charts: {}

};


const $ =
  id =>
    document.getElementById(id);


/* ===================================================
   Helpers
=================================================== */

function number(
  value,
  decimals = 0
) {

  return Number(value || 0)
    .toLocaleString(
      'zh-TW',
      {
        minimumFractionDigits:
          decimals,

        maximumFractionDigits:
          decimals
      }
    );

}


function percent(value) {

  return (
    Number(value || 0)
    * 100
  ).toFixed(1)
  + '%';

}


function growth(
  current,
  previous
) {

  if (
    previous === null ||
    previous === undefined ||
    previous === 0
  ) {

    return null;

  }


  return (
    (
      current
      -
      previous
    )
    /
    previous
  );

}


/* ===================================================
   台灣顏色
   上升 = 紅色
   下降 = 綠色
=================================================== */

function growthHTML(
  current,
  previous
) {

  const value =
    growth(
      current,
      previous
    );


  if (value === null) {

    return `
      <span class="text-xs text-slate-400">
        無上期比較
      </span>
    `;

  }


  const className =
    value > 0
      ? 'text-red-600'
      : value < 0
        ? 'text-emerald-700'
        : 'text-slate-500';


  return `
    <span class="${className} text-xs font-semibold">

      ${
        value > 0
          ? '↑'
          : value < 0
            ? '↓'
            : '−'
      }

      ${Math.abs(value * 100).toFixed(1)}%
      vs 上月

    </span>
  `;

}


/* ===================================================
   API
=================================================== */

async function loadDashboard(
  month = ''
) {

  $('loading')
    .classList
    .remove(
      'hidden'
    );


  $('dashboard')
    .classList
    .add(
      'hidden'
    );


  const url =
    CONFIG.API_URL
    +
    '?month='
    +
    encodeURIComponent(
      month
    )
    +
    '&_='
    +
    Date.now();


  const response =
    await fetch(
      url,
      {
        cache:
          'no-store'
      }
    );


  if (!response.ok) {

    throw new Error(
      'API 連線失敗：HTTP '
      +
      response.status
    );

  }


  const data =
    await response.json();


  if (!data.ok) {

    throw new Error(
      data.message
      ||
      '資料載入失敗'
    );

  }


  state.data =
    data;


  renderAll();


  $('loading')
    .classList
    .add(
      'hidden'
    );


  $('dashboard')
    .classList
    .remove(
      'hidden'
    );

}


/* ===================================================
   KPI
=================================================== */

function renderKpis() {

  const c =
    state.data.current;


  const p =
    state.data.previous;


  const cards = [

    {

      title:
        '本月兌換筆數',

      value:
        number(
          c.totalCount
        )
        +
        ' 筆',

      growth:
        growthHTML(
          c.totalCount,
          p?.totalCount
        )

    },

    {

      title:
        '兌換會員',

      value:
        number(
          c.uniqueMembers
        )
        +
        ' 人',

      growth:
        growthHTML(
          c.uniqueMembers,
          p?.uniqueMembers
        )

    },

    {

      title:
        '蘿蔔兌換量',

      value:
        number(
          c.totalRadish
        ),

      growth:
        growthHTML(
          c.totalRadish,
          p?.totalRadish
        )

    },

    {

      title:
        '綠點使用量',

      value:
        number(
          c.totalGreen
        ),

      growth:
        growthHTML(
          c.totalGreen,
          p?.totalGreen
        )

    },

    {

      title:
        '平均每筆蘿蔔',

      value:
        number(
          c.averageRadish,
          2
        ),

      growth:
        growthHTML(
          c.averageRadish,
          p?.averageRadish
        )

    },

    {

      title:
        '同月重複兌換率',

      value:
        percent(
          c.repeatRate
        ),

      growth:
        p
          ?
          growthHTML(
            c.repeatRate,
            p.repeatRate
          )
          :
          `
          <span class="text-xs text-slate-400">
            無上期比較
          </span>
          `

    },

    {

      title:
        '週末兌換占比',

      value:
        percent(
          c.weekendRate
        ),

      growth:
        ''

    },

    {

      title:
        '高額兌換占比',

      value:
        percent(
          c.highValueRate
        ),

      growth:
        `
        <span class="text-xs text-slate-400">
          單筆 ≥ 50 蘿蔔
        </span>
        `

    }

  ];


  $('kpis').innerHTML =
    cards.map(card => `

      <div
        class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100"
      >

        <div class="text-sm text-slate-500">
          ${card.title}
        </div>

        <div
          class="text-3xl font-extrabold text-emerald-950 mt-2"
        >
          ${card.value}
        </div>

        <div class="mt-3">
          ${card.growth}
        </div>

      </div>

    `).join('');

}


/* ===================================================
   Insights
=================================================== */

function renderInsights() {

  const c =
    state.data.current;


  const p =
    state.data.previous;


  const insights = [];


  insights.push(
    `本月共有 <strong>${number(c.totalCount)} 筆</strong>兌換，由 <strong>${number(c.uniqueMembers)} 位</strong>會員完成。`
  );


  insights.push(
    `最高兌換日為 <strong>${c.peakDate}</strong>，共 <strong>${c.peakCount} 筆</strong>。`
  );


  insights.push(
    `本月有 <strong>${c.repeatMembers} 位</strong>會員兌換至少 2 次，同月重複兌換率為 <strong>${percent(c.repeatRate)}</strong>。`
  );


  if (
    c.popularPeriods &&
    c.popularPeriods.length
  ) {

    insights.push(
      `熱門兌換時段為 <strong>${c.popularPeriods.join('、')}</strong>。`
    );

  }


  if (p) {

    const change =
      growth(
        c.totalCount,
        p.totalCount
      );


    if (change !== null) {

      insights.push(

        change >= 0

          ? `兌換筆數較上月增加 <strong>${Math.abs(change * 100).toFixed(1)}%</strong>。`

          : `兌換筆數較上月下降 <strong>${Math.abs(change * 100).toFixed(1)}%</strong>，可再搭配活動檔期與曝光節奏觀察。`

      );

    }

  }


  $('insights').innerHTML = `

    <h3
      class="font-bold text-emerald-800 mb-3"
    >
      📊 自動數據洞察
    </h3>

    <ul
      class="space-y-2 text-sm leading-6"
    >

      ${
        insights
          .map(
            text =>
              `<li>• ${text}</li>`
          )
          .join('')
      }

    </ul>

  `;

}


/* ===================================================
   Daily Chart
=================================================== */

function renderDailyChart() {

  destroyChart_(
    'daily'
  );


  const c =
    state.data.current;


  state.charts.daily =
    new Chart(
      $('dailyChart'),
      {

        type:
          'line',

        data: {

          labels:
            c.daily.map(
              item =>
                item.date.slice(5)
            ),

          datasets: [

            {

              label:
                '兌換筆數',

              data:
                c.daily.map(
                  item =>
                    item.count
                ),

              borderWidth:
                2,

              pointRadius:
                4,

              tension:
                0.3

            }

          ]

        },


        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,

          layout: {

            padding: {
              top: 24
            }

          },

          interaction: {

            intersect:
              false,

            mode:
              'index'

          },

          plugins: {

            datalabels: {

              display: function(context) {

                return Number(
                  context.dataset.data[
                    context.dataIndex
                  ]
                ) > 0;

              },

              anchor:
                'end',

              align:
                'top',

              offset:
                3,

              color:
                '#334155',

              font: {

                size:
                  10,

                weight:
                  '600'

              },

              formatter: function(value) {

                return Number(value)
                  .toLocaleString(
                    'zh-TW'
                  );

              }

            }

          },

          scales: {

            y: {

              beginAtZero:
                true,

              grace:
                '20%'

            }

          }

        }

      }
    );

}


/* ===================================================
   Member
=================================================== */

function renderMembers() {

  const c =
    state.data.current;


  destroyChart_(
    'repeat'
  );


  state.charts.repeat =
    new Chart(
      $('repeatChart'),
      {

        type:
          'doughnut',

        data: {

          labels: [

            '1 次',
            '2 次',
            '3 次以上'

          ],

          datasets: [

            {

              data: [

                c.repeatDistribution.once,

                c.repeatDistribution.twice,

                c.repeatDistribution.threePlus

              ]

            }

          ]

        },

        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,

          plugins: {

            datalabels: {

              display:
                true,

              color:
                '#ffffff',

              anchor:
                'center',

              align:
                'center',

              font: {

                size:
                  12,

                weight:
                  'bold'

              },

              formatter: function(
                value,
                context
              ) {

                const data =
                  context.chart.data
                    .datasets[0]
                    .data;


                const total =
                  data.reduce(
                    (
                      sum,
                      item
                    ) =>
                      sum
                      +
                      Number(item),
                    0
                  );


                const rate =
                  total > 0
                    ?
                    value
                    /
                    total
                    *
                    100
                    :
                    0;


                return (
                  value
                  +
                  '人\n'
                  +
                  rate.toFixed(1)
                  +
                  '%'
                );

              }

            }

          }

        }

      }
    );


  $('memberSummary')
    .innerHTML = `

      ${summaryRow_(
        '不重複會員',
        `${number(c.uniqueMembers)} 人`
      )}

      ${summaryRow_(
        '本月兌換 2 次以上',
        `${number(c.repeatMembers)} 人`
      )}

      ${summaryRow_(
        '同月重複兌換率',
        percent(c.repeatRate)
      )}

      ${summaryRow_(
        '前 5 大兌換會員綠點占比',
        percent(c.top5Rate)
      )}

      ${summaryRow_(
        '單筆 ≥50 蘿蔔交易',
        `${number(c.highValueCount)} 筆`
      )}

    `;

}


function summaryRow_(
  title,
  value
) {

  return `

    <div
      class="flex justify-between border-b pb-3"
    >

      <span class="text-slate-500">
        ${title}
      </span>

      <strong class="text-emerald-800">
        ${value}
      </strong>

    </div>

  `;

}

/* ===================================================

=================================================== */

function renderHeatmap() {

  const data =
    state.data.current.heatmap;


  const max =
    Math.max(
      ...data.map(
        item =>
          item.count
      ),
      1
    );


  const weekdays =
    [
      '日',
      '一',
      '二',
      '三',
      '四',
      '五',
      '六'
    ];


  const periods =
    [
      '凌晨 00–05',
      '上午 06–11',
      '下午 12–17',
      '晚上 18–23'
    ];


  let html = `

    <div
      class="grid grid-cols-5 gap-2 text-sm min-w-[650px]"
    >

      <div></div>

  `;


  periods.forEach(
    period => {

      html += `

        <div
          class="text-center text-xs text-slate-500"
        >
          ${period}
        </div>

      `;

    }
  );


  weekdays.forEach(
    weekday => {

      html += `

        <div
          class="font-semibold flex items-center"
        >
          週${weekday}
        </div>

      `;


      periods.forEach(
        period => {

          const item =
            data.find(
              row =>
                row.weekday === weekday
                &&
                row.period === period
            );


          const count =
            item?.count || 0;


          const intensity =
            count / max;


          const opacity =
            0.08
            +
            intensity
            *
            0.55;


          html += `

            <div
              class="rounded-lg p-3 text-center font-semibold"
              style="
                background:
                rgba(
                  5,
                  150,
                  105,
                  ${opacity}
                );
              "
            >
              ${count}
            </div>

          `;

        }
      );

    }
  );


  html += '</div>';


  $('heatmap')
    .innerHTML =
      `
      <div class="overflow-x-auto">
        ${html}
      </div>
      `;

}

/* ===================================================
   Month Chart
=================================================== */

function renderMonthChart() {

  const metric =
    $('metricSelector').value;


  const configs = {

    totalCount: {
      label:
        '兌換筆數'
    },

    uniqueMembers: {
      label:
        '兌換會員'
    },

    totalRadish: {
      label:
        '蘿蔔兌換量'
    },

    repeatRate: {
      label:
        '同月重複兌換率',

      percent:
        true
    },

    averageRadish: {
      label:
        '平均每筆蘿蔔',

      decimal:
        true
    }

  };


  const config =
    configs[metric];


  destroyChart_(
    'month'
  );


  state.charts.month =
    new Chart(
      $('monthChart'),
      {

        type:
          'bar',

        data: {

          labels:
            state.data.monthlySummary
              .map(
                item =>
                  item.month
              ),

          datasets: [

            {

              label:
                config.label,

              data:
                state.data.monthlySummary
                  .map(
                    item =>
                      config.percent
                        ?
                        item[metric] * 100
                        :
                        item[metric]
                  )

            }

          ]

        },

        options: {

          responsive:
            true,

          maintainAspectRatio:
            false,

          layout: {

            padding: {
              top: 30
            }

          },

          plugins: {

            datalabels: {

              anchor:
                'end',

              align:
                'top',

              color:
                '#334155',

              font: {

                size:
                  11,

                weight:
                  '600'

              },

              formatter: function(value) {

                if (
                  config.percent
                ) {

                  return Number(value)
                    .toFixed(1)
                    +
                    '%';

                }


                if (
                  config.decimal
                ) {

                  return Number(value)
                    .toFixed(1);

                }


                return Number(value)
                  .toLocaleString(
                    'zh-TW'
                  );

              }

            }

          },

          scales: {

            y: {

              beginAtZero:
                true,

              grace:
                '15%',

              ticks: {

                callback:
                  value =>
                    config.percent
                      ?
                      `${value}%`
                      :
                      value

              }

            }

          }

        }

      }
    );

}


/* ===================================================
   Activities
=================================================== */

function renderActivities() {

  const activities =
    state.data.activities;


  if (!activities.length) {

    $('activityTable')
      .innerHTML = `

        <tr>

          <td
            colspan="7"
            class="p-8 text-center text-slate-400"
          >
            本月尚未設定活動註記
          </td>

        </tr>

      `;

    return;

  }


  $('activityTable')
    .innerHTML =
      activities.map(
        activity => {

          const diff =
            activity.differenceRate;


          let diffText =
            '-';


          let diffClass =
            'text-slate-500';


          if (diff !== null) {

            diffText =
              `${
                diff >= 0
                  ? '+'
                  : ''
              }${(diff * 100).toFixed(1)}%`;


            /*
             * 台灣顏色：
             * 上升紅色
             * 下降綠色
             */

            diffClass =
              diff > 0
                ? 'text-red-600'
                : diff < 0
                  ? 'text-emerald-700'
                  : 'text-slate-500';

          }


          return `

            <tr class="border-b">

              <td class="p-3">
                ${activity.date}
              </td>

              <td class="p-3 font-semibold">
                ${activity.name}
              </td>

              <td class="p-3">
                ${activity.channel || '-'}
              </td>

              <td class="p-3 text-right">
                ${number(activity.transactionCount)}
              </td>

              <td class="p-3 text-right">
                ${number(activity.monthDailyAverage, 2)}
              </td>

              <td
                class="p-3 text-right font-semibold ${diffClass}"
              >
                ${diffText}
              </td>

              <td class="p-3">
                ${activity.observation}
              </td>

            </tr>

          `;

        }
      ).join('');

}


/* ===================================================
   Month Selector
=================================================== */

function renderMonthSelector() {

  const select =
    $('monthSelector');


  select.innerHTML =
    state.data.months
      .map(
        month => `

          <option
            value="${month}"

            ${
              month ===
              state.data.selectedMonth
                ?
                'selected'
                :
                ''
            }
          >

            ${month}

          </option>

        `
      )
      .join('');

}


/* ===================================================
   Tabs
=================================================== */

function setupTabs() {

  document
    .querySelectorAll(
      '.tab-btn'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          document
            .querySelectorAll(
              '.tab-section'
            )
            .forEach(section => {

              section
                .classList
                .add(
                  'hidden'
                );

            });


          document
            .querySelectorAll(
              '.tab-btn'
            )
            .forEach(btn => {

              btn
                .classList
                .remove(
                  'bg-emerald-700',
                  'text-white'
                );


              btn
                .classList
                .add(
                  'bg-white'
                );

            });


          const target =
            $(
              'tab-'
              +
              button.dataset.tab
            );


          if (target) {

            target
              .classList
              .remove(
                'hidden'
              );

          }


          button
            .classList
            .add(
              'bg-emerald-700',
              'text-white'
            );


          button
            .classList
            .remove(
              'bg-white'
            );

        }

      );

    });

}

/* ===================================================
   Destroy Chart
=================================================== */

function destroyChart_(key) {

  if (
    state.charts[key]
  ) {

    state.charts[key]
      .destroy();


    state.charts[key] =
      null;

  }

}


/* ===================================================
   Events
=================================================== */

$('monthSelector')
  .addEventListener(
    'change',
    event => {

      loadDashboard(
        event.target.value
      );

    }
  );


$('metricSelector')
  .addEventListener(
    'change',
    renderMonthChart
  );


/* ===================================================
   Start
=================================================== */

window.addEventListener(
  'DOMContentLoaded',
  async () => {

    setupTabs();


    try {

      await loadDashboard();

    }
    catch(error) {

      console.error(
        error
      );


      $('loading')
        .innerHTML = `

          <div
            class="text-red-600 text-center p-8 max-w-xl"
          >

            <strong class="text-lg">
              資料讀取失敗
            </strong>

            <br><br>

            <div
              class="text-sm bg-red-50 border border-red-100 rounded-xl p-4 break-all"
            >
              ${error.message}
            </div>

          </div>

        `;

    }

  }
);

</script>
