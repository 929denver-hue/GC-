<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>GC贈物網 IBOX 數據儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --gc-green: #2DB57D;
      --gc-blue: #59C3FF;
      --gc-yellow: #FFD268;
      --gc-red: #FF7A7A;
      --text-dark: #1a1a1a;
      --text-light: #777;
    }
    body {
      font-family: "Inter","Microsoft JhengHei",Helvetica;
      background:#f7f7f7;
      max-width:1100px;
      margin:30px auto;
      padding:20px;
      color:var(--text-dark);
    }
    h2 { margin-bottom:8px; }
    h3 { margin-top:0; margin-bottom:8px; }
    .panel {
      background:white;
      padding:16px;
      border-radius:12px;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
      margin-bottom:20px;
    }
    table {
      width:100%; border-collapse:collapse; background:white;
      border-radius:8px; overflow:hidden;
      font-size:14px;
    }
    th {
      background:var(--gc-green);
      color:white;
      padding:10px;
    }
    td {
      text-align:center;
      padding:8px;
      border-bottom:1px solid #eee;
    }
    tbody tr:hover { background:#f1fff7; transition:0.3s; }

    .flex { display:flex; gap:22px; flex-wrap:wrap; }
    .chart-box { flex:1; min-width:350px; height:260px; }
    /* 🌟 新增：讓複合圖有比較好的高度 */
    .mixed-chart-box { width: 100%; height: 400px; } 

    /* MoM / YoY 顏色：成長紅、減少綠、持平灰 */
    .growth { color: #d91e18; font-weight:600; }
    .decline { color: #0f8b4b; font-weight:600; }
    .neutral { color:#7c7c7c; }

    /* RWD */
    @media(max-width:768px){
      body{padding:10px;}
      .chart-box{min-width:100%;}
    }
  </style>
</head>

<body>

<script>
// 🔧 這裡改成你自己的 Web App URL
const API_URL = "https://script.google.com/macros/s/AKfycbx9eVJpOxflNXwrMmTFFQsR74f74Vr9RYlOXi5NU7DKDVQE_05VDTraZ6TRtl-t8A6nXg/exec";

let globalRows = [];
let totalChart, momChart, pieChart, yoyMixedChart; // 🌟 新增 yoyMixedChart 變數

function parseMonth(raw) {
  if (raw == null) return "";
  const s = String(raw).trim();
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    return `${y}-${m}`;
  }
  let m = s.match(/^(\d{4})[-/](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}`;
  m = s.match(/(20\d{2})\D+(\d{1,2})\D*月?/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}`;
  m = s.match(/(20\d{2}).*?(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}`;
  return s;
}

function diffClass(value) {
  if (value === null || value === 0) return "neutral";
  if (value > 0) return "growth";   
  if (value < 0) return "decline";  
  return "neutral";
}

async function loadData() {
  try {
    const res  = await fetch(API_URL);
    const json = await res.json();
    globalRows  = json.rows || [];

    buildTableFilter();
    applyFilterToTable();

    drawCharts();
    drawPie();
    updateMonthlyReport();

    // 🌟 新增：初始化並畫出歷年同期複合圖
    initYoYFilter();
    drawYoYMixedChart();
  } catch (e) {
    console.error(e);
  }
}

function buildTableFilter() {
  const sel = document.getElementById("tableFilter");
  sel.innerHTML = `
    <option value="all">全部年份</option>
    <option value="last12">最近12個月</option>
  `;
  const years = [...new Set(globalRows.map(r => parseMonth(r.month).slice(0,4)))].sort();
  years.forEach(y => {
    sel.innerHTML += `<option value="${y}">${y} 年</option>`;
  });
  sel.value = globalRows.length > 12 ? "last12" : "all";
  sel.onchange = applyFilterToTable;
}

function applyFilterToTable() {
  const mode = document.getElementById("tableFilter").value;
  let rows = [...globalRows];
  if (mode === "last12") {
    rows = rows.slice(-12);
  } else if (mode !== "all") {
    rows = rows.filter(r => parseMonth(r.month).startsWith(mode));
  }
  renderTable(rows);
}

function renderTable(rows) {
  const tbody = document.getElementById("dataBody");
  tbody.innerHTML = "";
  rows.forEach((r, idx) => {
    const monthKey = parseMonth(r.month);            
    const displayMonth = `${monthKey.slice(0,4)} / ${monthKey.slice(5,7)}`; 
    const total = Number(r.totalCount || 0);

    let mom = null;
    if (idx > 0) mom = total - Number(rows[idx - 1].totalCount || 0);

    let yoy = null;
    const year  = parseInt(monthKey.slice(0,4), 10);
    const month = monthKey.slice(5,7);
    const lastYearRow = globalRows.find(row => parseMonth(row.month) === `${year-1}-${month}`);
    if (lastYearRow) {
      yoy = total - Number(lastYearRow.totalCount || 0);
    }

    tbody.innerHTML += `
      <tr>
        <td>${displayMonth}</td>
        <td>${total.toLocaleString()}</td>
        <td>${r.shareCount ?? ""}</td>
        <td>${r.flashCount ?? ""}</td>
        <td>${r.giftCount ?? ""}</td>
        <td>${r.demandCount ?? ""}</td>
        <td class="${diffClass(mom)}">${mom === null ? "-" : (mom > 0 ? "+" : "") + mom.toLocaleString()}</td>
        <td class="${diffClass(yoy)}">${yoy === null ? "-" : (yoy > 0 ? "+" : "") + yoy.toLocaleString()}</td>
      </tr>
    `;
  });
}

function drawCharts() {
  const labels = globalRows.map(r => {
    const m = parseMonth(r.month);
    return `${m.slice(0,4)}/${m.slice(5,7)}`;
  });
  const totals = globalRows.map(r => Number(r.totalCount || 0));
  const diff   = totals.map((v,i) => i===0 ? 0 : v - totals[i-1]);

  if (totalChart) totalChart.destroy();
  totalChart = new Chart(document.getElementById("totalChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "寄件量",
        data: totals,
        borderColor: "#2DB57D",
        backgroundColor: "rgba(45,181,125,.2)",
        fill: true,
        tension: .35,
        pointRadius: 4
      }]
    },
    options: { plugins: { legend: { display: false } } }
  });

  if (momChart) momChart.destroy();
  momChart = new Chart(document.getElementById("momChart"), {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "與上月差異",
        data: diff,
        backgroundColor: diff.map(v => v >= 0 ? "#d91e18" : "#0f8b4b")
      }]
    }
  });
}

function drawPie() {
  const r = globalRows.at(-1);
  if (!r) return;
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById("pieChart"), {
    type: "pie",
    data: {
      labels:["分享通","閃送區","禮物池","需求池"],
      datasets:[{
        data:[r.shareCount,r.flashCount,r.giftCount,r.demandCount],
        backgroundColor:["#2DB57D","#59C3FF","#FFD268","#FF7A7A"]
      }]
    }
  });
}

function updateMonthlyReport() {
  const box = document.getElementById("monthlyReportText");
  if (!box) return;
  if (!globalRows.length) return box.textContent = "目前尚未有任何資料。";

  const latest = globalRows[globalRows.length - 1];
  const latestKey = parseMonth(latest.month);
  const monthLabel = `${latestKey.slice(0,4)} / ${latestKey.slice(5,7)}`;
  const total = Number(latest.totalCount || 0);

  let momSentence = "尚無上個月資料可比較。";
  if (globalRows.length >= 2) {
    const prevTotal = Number(globalRows[globalRows.length - 2].totalCount || 0);
    const diff = total - prevTotal;
    const rate = prevTotal > 0 ? (diff / prevTotal) * 100 : 0;
    const word = diff > 0 ? "成長" : (diff < 0 ? "減少" : "持平");
    momSentence = diff===0 ? `相較上月，寄件量${word}，皆為 ${total.toLocaleString()} 件。` : `相較上月，寄件量${word} ${Math.abs(diff).toLocaleString()} 件（約 ${rate.toFixed(1)}%）。`;
  }

  let yoySentence = "目前尚無去年同期資料可供比較。";
  const year = parseInt(latestKey.slice(0,4), 10);
  const month = latestKey.slice(5,7);
  const lastYearRow = globalRows.find(r => parseMonth(r.month) === `${year-1}-${month}`);
  if (lastYearRow) {
    const lastYearTotal = Number(lastYearRow.totalCount || 0);
    const diff = total - lastYearTotal;
    const rate = lastYearTotal > 0 ? (diff / lastYearTotal) * 100 : 0;
    const word = diff > 0 ? "成長" : (diff < 0 ? "減少" : "持平");
    yoySentence = diff===0 ? `與去年同期相比，寄件量${word}，皆為 ${total.toLocaleString()} 件。` : `與去年同期相比，寄件量${word} ${Math.abs(diff).toLocaleString()} 件（約 ${rate.toFixed(1)}%）。`;
  }

  const channelTotal = Number(latest.shareCount||0) + Number(latest.flashCount||0) + Number(latest.giftCount||0) + Number(latest.demandCount||0);
  let channelSentence = "本月尚未有各通路細項資料。";
  if (channelTotal > 0) {
    const pct = v => (v / channelTotal * 100).toFixed(1) + "%";
    const parts = [];
    if (latest.shareCount > 0) parts.push(`分享通約 ${pct(latest.shareCount)}`);
    if (latest.flashCount > 0) parts.push(`閃送區約 ${pct(latest.flashCount)}`);
    if (latest.giftCount > 0) parts.push(`禮物池約 ${pct(latest.giftCount)}`);
    if (latest.demandCount > 0) parts.push(`需求池約 ${pct(latest.demandCount)}`);
    channelSentence = "各通路占比約為：" + parts.join("、") + "。";
  }

  box.innerHTML = `📦 <b>${monthLabel} GC贈物網 IBOX當月報告</b><br>本月寄件量：<b>${total.toLocaleString()} 件</b>。<br>・${momSentence}<br>・${yoySentence}<br>・${channelSentence}`;
}

// ================== 🌟 新增：歷年同期比較複合圖邏輯 ==================

// 準備月份篩選器，預設抓最新一筆資料的月份
function initYoYFilter() {
  const latest = globalRows[globalRows.length - 1];
  let defaultMonth = "01";
  if(latest) {
    defaultMonth = parseMonth(latest.month).slice(5,7);
  }
  
  const sel = document.getElementById("yoyMonthFilter");
  sel.innerHTML = "";
  for(let i=1; i<=12; i++) {
    let m = i.toString().padStart(2, '0');
    let selected = (m === defaultMonth) ? "selected" : "";
    sel.innerHTML += `<option value="${m}" ${selected}>${m}月</option>`;
  }
  // 當使用者改變月份時，重新畫圖
  sel.onchange = drawYoYMixedChart;
}

// 繪製雙軸複合圖
function drawYoYMixedChart() {
  const selectedMonth = document.getElementById("yoyMonthFilter").value;
  
  // 篩選出所有年份中，等於所選月份的資料 (例如所有的 "-07")
  const filtered = globalRows.filter(r => parseMonth(r.month).endsWith(`-${selectedMonth}`));

  const labels = [];       // X軸：年月 (例如 2021/7)
  const volumes = [];      // Y軸1 (長條圖)：寄件量
  const growthRates = [];  // Y軸2 (折線圖)：成長率(%)
  const growthLabels = []; // 紀錄完整資訊，供游標懸停顯示

  filtered.forEach((r, idx) => {
    const mKey = parseMonth(r.month);
    labels.push(`${mKey.slice(0,4)}/${Number(selectedMonth)}`); 
    
    const vol = Number(r.totalCount || 0);
    volumes.push(vol);

    if (idx === 0) {
      growthRates.push(null);
      growthLabels.push("-");
    } else {
      const prevVol = Number(filtered[idx-1].totalCount || 0);
      const diff = vol - prevVol;
      const rate = prevVol > 0 ? (diff / prevVol) * 100 : 0;
      
      growthRates.push(rate.toFixed(2));
      growthLabels.push(`${rate.toFixed(2)}% (${diff > 0 ? '+' : ''}${diff}件)`);
    }
  });

  if(yoyMixedChart) yoyMixedChart.destroy();
  
  yoyMixedChart = new Chart(document.getElementById("yoyMixedChart"), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          type: 'line', // 這是折線圖
          label: '成長幅度 (%)',
          data: growthRates,
          borderColor: '#cc0000',      // 紅色線條 (參考你的圖片)
          backgroundColor: '#cc0000',
          yAxisID: 'y1',               // 綁定右側的 Y軸
          borderWidth: 2,
          pointRadius: 6,
          pointStyle: 'rectRot',       // 菱形點狀，還原圖片風格
          tension: 0.1
        },
        {
          type: 'bar',  // 這是長條圖
          label: '寄件量',
          data: volumes,
          backgroundColor: '#7faadc',  // 淺藍色長條 (參考你的圖片)
          yAxisID: 'y',                // 綁定左側的 Y軸
          barPercentage: 0.6
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          callbacks: {
            label: function(context) {
              if (context.datasetIndex === 0) { // 折線圖
                return ` 成長幅度: ${growthLabels[context.dataIndex]}`;
              } else { // 長條圖
                return ` 寄件量: ${context.parsed.y} 件`;
              }
            }
          }
        }
      },
      scales: {
        y: {
          type: 'linear',
          display: true,
          position: 'left',
          title: { display: true, text: '寄件量 (件)' },
          grid: { drawOnChartArea: true }
        },
        y1: {
          type: 'linear',
          display: true,
          position: 'right',
          title: { display: true, text: '成長幅度 (%)' },
          grid: { drawOnChartArea: false }, // 不畫兩次網格線，避免混亂
          ticks: { callback: value => value + "%" }
        }
      }
    }
  });
}

window.onload = loadData;
</script>

<!-- ====================== UI ====================== -->

<div class="panel">
  <h2>📦i郵箱寄件統計表</h2>
  <div style="margin-bottom:10px;">
    顯示方式：
    <select id="tableFilter"></select>
  </div>
  <table>
    <thead>
      <tr>
        <th>月份</th><th>寄件總量</th><th>分享通</th><th>閃送區</th><th>禮物池</th><th>需求池</th><th>與上月比較</th><th>與去年同期比較</th>
      </tr>
    </thead>
    <tbody id="dataBody"></tbody>
  </table>
</div>

<!-- 🌟 新增：歷年同期複合圖面板 -->
<div class="panel">
  <h3>📊 IBOX 歷年同期寄件量與去年同期成長幅度複合圖</h3>
  <div style="margin-bottom:15px; font-size:14px;">
    選擇比較月份：
    <select id="yoyMonthFilter" style="padding: 4px; font-size: 14px; border-radius: 4px;"></select>
  </div>
  <div class="mixed-chart-box">
    <canvas id="yoyMixedChart"></canvas>
  </div>
</div>

<div class="flex">
  <div class="panel chart-box">
    <h3>📈 寄件趨勢</h3>
    <canvas id="totalChart"></canvas>
  </div>
  <div class="panel chart-box">
    <h3>📊 月增減變化（成長紅、減少綠）</h3>
    <canvas id="momChart"></canvas>
  </div>
</div>

<div class="panel" id="monthlyReportPanel">
  <h3>📝 當月報告</h3>
  <div id="monthlyReportText" style="line-height:1.7; font-size:14px;"></div>
</div>

<div class="panel chart-box" style="width: 50%;">
  <h3>🥧 最新月份來源分布</h3>
  <canvas id="pieChart"></canvas>
</div>

</body>
</html>
